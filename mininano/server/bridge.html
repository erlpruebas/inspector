<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Nano Bridge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe7;
      --panel: #fffdfa;
      --ink: #1f2933;
      --muted: #667085;
      --line: #ded6c8;
      --accent: #275d7a;
      --good: #ecf5ef;
      --warn: #fdf1c9;
      --bad: #fde7e7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(39, 93, 122, 0.12), transparent 22rem),
        linear-gradient(180deg, #faf7f1, var(--bg));
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(900px, 100%);
      min-height: 560px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(31, 41, 51, 0.12);
      padding: 22px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      text-align: right;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: white;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
    }

    .good { background: var(--good); }
    .warn { background: var(--warn); }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font: inherit;
      color: var(--ink);
    }

    .log {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      padding: 14px;
      overflow: auto;
    }

    .log .small {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e7eef6;
      color: #234d69;
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      body { padding: 0; }
      main {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
      .status { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mini Nano Bridge</h1>
      <div id="status" class="status">Iniciando...</div>
    </header>

    <section class="grid">
      <div class="card good">
        <strong>Rol</strong>
        <pre>Esta pestaña ejecuta el modelo local y entrega las respuestas al servidor HTTP.</pre>
      </div>
      <div class="card warn">
        <strong>Modo de prueba</strong>
        <pre>Abre esta pagina con <code>?mock=1</code> para simular la generacion sin Gemini Nano real.</pre>
      </div>
    </section>

    <section class="log">
      <div class="small">
        <span class="pill">Bridge activo</span>
        <span id="modeLabel" style="margin-left:8px;">Esperando conexion...</span>
      </div>
      <pre id="log">Listo para recibir trabajos.</pre>
    </section>
  </main>

  <script>
    const statusEl = document.querySelector("#status");
    const logEl = document.querySelector("#log");
    const modeLabel = document.querySelector("#modeLabel");
    const params = new URLSearchParams(location.search);
    const mockMode = params.has("mock");

    const systemPrompt = "Eres un asistente util, rapido y claro. Responde siempre en espanol.";
    let session = null;
    let adapter = null;
    let currentJobId = null;
    let busy = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setLog(text) {
      logEl.textContent = text;
    }

    function setMode(text) {
      modeLabel.textContent = text;
    }

    function getPromptApi() {
      if (window.LanguageModel) {
        return {
          name: "LanguageModel",
          availability: (options) => window.LanguageModel.availability(options),
          create: (options) => window.LanguageModel.create(options)
        };
      }
      if (window.ai?.languageModel) {
        return {
          name: "window.ai.languageModel",
          availability: async (options) => {
            if (typeof window.ai.languageModel.availability === "function") {
              return window.ai.languageModel.availability(options);
            }
            return "unavailable";
          },
          create: (options) => window.ai.languageModel.create(options)
        };
      }
      return null;
    }

    function installMock() {
      if (!mockMode) return;
      window.LanguageModel = {
        availability: async () => "available",
        create: async () => ({
          async *promptStreaming(input) {
            const lastUser = input
              .split("\n")
              .filter((line) => line.startsWith("User:"))
              .slice(-1)[0] || input;
            const question = lastUser.replace("User:", "").trim();
            const answer = `Modo prueba: recibi "${question}". El puente esta funcionando.`;
            for (const chunk of answer.split(" ")) {
              await new Promise((resolve) => setTimeout(resolve, 35));
              yield chunk + " ";
            }
          }
        })
      };
    }

    function toPrompt(messages) {
      const lines = [systemPrompt, "", "Conversation:"];
      for (const message of messages || []) {
        const role = (message.role || "user").toLowerCase();
        const prefix = role === "assistant" ? "Assistant" : role === "system" ? "System" : "User";
        lines.push(`${prefix}: ${message.content || ""}`);
      }
      lines.push("", "Assistant:");
      return lines.join("\n");
    }

    async function postEvent(event) {
      await fetch("/api/bridge/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          job_id: currentJobId,
          ...event
        })
      });
    }

    async function ensureSession() {
      if (session) return true;
      adapter = getPromptApi();
      if (!adapter) {
        setStatus("Sin API");
        setMode("No existe window.ai / LanguageModel");
        setLog("Abre Chrome compatible o usa ?mock=1 para probar el puente.");
        return false;
      }

      try {
        const availability = await adapter.availability({
          initialPrompts: [{ role: "system", content: systemPrompt }]
        });
        if (availability === "unavailable") {
          setStatus("Modelo no disponible");
          setMode("API detectada pero modelo no listo");
          setLog("Gemini Nano local aun no esta listo en este navegador.");
          return false;
        }

        session = await adapter.create({
          initialPrompts: [{ role: "system", content: systemPrompt }]
        });
        setStatus(mockMode ? "Listo en mock" : "Listo");
        setMode(mockMode ? "Simulacion local" : "Gemini Nano local");
        setLog("Puente conectado y esperando trabajos.");
        return true;
      } catch (error) {
        setStatus("Error");
        setMode("Fallo al crear la sesion");
        setLog(error.message || String(error));
        return false;
      }
    }

    async function pingServer() {
      try {
        await fetch("/api/bridge/ping", { method: "POST" });
      } catch (error) {
        // Ignore temporary disconnects.
      }
    }

    async function processJob(job) {
      if (busy) return;
      busy = true;
      currentJobId = job.id;
      setStatus(`Procesando ${job.id}`);
      setLog(`Procesando trabajo ${job.id}`);

      try {
        if (!(await ensureSession())) {
          await postEvent({ type: "error", error: "bridge not ready" });
          return;
        }

        const prompt = toPrompt(job.messages);
        let content = "";
        await postEvent({ type: "started" });

        for await (const chunk of session.promptStreaming(prompt)) {
          const text = String(chunk);
          content += text;
          setLog(content);
          await postEvent({ type: "delta", delta: text, content });
        }

        await postEvent({ type: "done", content });
        setStatus("Listo");
        setLog(content);
      } catch (error) {
        await postEvent({ type: "error", error: error.message || String(error) });
        setStatus("Error");
        setLog(error.message || String(error));
      } finally {
        busy = false;
        currentJobId = null;
      }
    }

    async function poll() {
      try {
        await pingServer();
        const response = await fetch("/api/bridge/next", { cache: "no-store" });
        if (response.ok) {
          const payload = await response.json();
          if (payload.job) {
            await processJob(payload.job);
          } else if (!session) {
            await ensureSession();
          }
        }
      } catch (error) {
        if (!session) {
          setStatus("Esperando servidor");
          setMode("Servidor no disponible");
          setLog(error.message || String(error));
        }
      } finally {
        window.setTimeout(poll, 250);
      }
    }

    installMock();
    ensureSession().then(() => poll());
  </script>
</body>
</html>
