<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat API Nano</title>
  <style>
    :root {
      --bg: #f3efe7; --panel: #fffdfa; --ink: #1f2933; --muted: #667085;
      --line: #ded6c8; --accent: #275d7a; --good: #ecf5ef; --bad: #fde7e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: var(--bg);
      color: var(--ink); display: grid; place-items: center; min-height: 100vh;
    }
    main {
      width: min(800px, 100%); height: min(80vh, 900px);
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
      box-shadow: 0 18px 60px rgba(31, 41, 51, 0.12);
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    h1 { margin: 0; font-size: 1.1rem; }
    #status { font-size: 0.9rem; color: var(--muted); }
    #setup { padding: 30px; text-align: center; }
    #setup p { margin: 0 0 12px; color: var(--muted); }
    #setup input {
      width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line);
      border-radius: 6px; margin-bottom: 12px;
    }
    #chat {
      display: none; flex-direction: column; height: 100%; overflow: hidden;
    }
    #messages { flex-grow: 1; overflow-y: auto; padding: 16px; }
    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      margin-bottom: 10px; line-height: 1.5;
    }
    .bubble.user {
      background: var(--accent); color: white; margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant {
      background: var(--good); color: var(--ink); margin-right: auto;
      border-bottom-left-radius: 4px; white-space: pre-wrap;
    }
    .bubble.system {
      background: #fdf1c9; font-size: 0.9rem; text-align: center;
      max-width: 100%; color: var(--muted);
    }
    footer {
      padding: 12px; border-top: 1px solid var(--line); display: flex; gap: 10px;
      background: #fbfaf7;
    }
    #promptInput {
      flex-grow: 1; padding: 12px; border: 1px solid var(--line);
      border-radius: 6px; font-size: 1rem;
    }
    button {
      padding: 0 24px; border: none; border-radius: 6px; background: var(--accent);
      color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { background: #ccc; }
    button:hover:not(:disabled) { background: #1d4c68; }
  </style>
</head>
<body>
  <main>
    <div id="setup">
      <h1>Conectar a Mini Nano</h1>
      <p>Usa esta pagina desde Cloudflare Tunnel o pega la URL del servidor.</p>
      <input type="text" id="apiUrl" placeholder="https://tu-url-aleatoria.trycloudflare.com">
      <input type="password" id="apiKey" placeholder="Clave API opcional">
      <button id="saveBtn">Guardar y Conectar</button>
    </div>

    <div id="chat">
      <header>
        <h1>Chat Remoto</h1>
        <div id="status">Desconectado</div>
      </header>
      <div id="messages"></div>
      <footer>
        <input type="text" id="promptInput" placeholder="Escribe un mensaje..." disabled>
        <button id="sendBtn" disabled>Enviar</button>
      </footer>
    </div>
  </main>

  <script>
    const setupEl = document.getElementById('setup');
    const chatEl = document.getElementById('chat');
    const apiUrlInput = document.getElementById('apiUrl');
    const apiKeyInput = document.getElementById('apiKey');
    const saveBtn = document.getElementById('saveBtn');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    let history = [];
    let apiBaseUrl = '';
    let apiKey = '';

    function addMessage(role, content) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = content;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function setReadyState(ready) {
      promptInput.disabled = !ready;
      sendBtn.disabled = !ready;
      if (ready) {
        statusEl.textContent = 'Conectado';
        statusEl.style.color = '#16a34a';
        promptInput.focus();
      } else {
        statusEl.textContent = 'Enviando...';
        statusEl.style.color = 'var(--muted)';
      }
    }

    async function checkConnection() {
      if (!apiBaseUrl) return;
      statusEl.textContent = 'Comprobando...';
      try {
        const response = await fetch(`${apiBaseUrl}/v1/models`, {
          headers: authHeaders(),
        });
        if (!response.ok) throw new Error(`El servidor devolvió ${response.status}`);
        const data = await response.json();
        if (!data?.data?.length) throw new Error('No se encontraron modelos');
        
        setupEl.style.display = 'none';
        chatEl.style.display = 'flex';
        setReadyState(true);
        addMessage('system', `Conectado a ${apiBaseUrl}`);
      } catch (error) {
        alert(`No se pudo conectar a la URL.\nError: ${error.message}\nAsegúrate de que el servidor y el túnel están activos.`);
        statusEl.textContent = 'Error de conexión';
        localStorage.removeItem('miniNanoApiUrl');
      }
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      if (apiKey) headers.Authorization = `Bearer ${apiKey}`;
      return headers;
    }

    async function handleSend() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      setReadyState(false);
      addMessage('user', prompt);
      promptInput.value = '';
      history.push({ role: 'user', content: prompt });

      const assistantBubble = addMessage('assistant', '...');
      let fullContent = '';

      try {
        const response = await fetch(`${apiBaseUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            model: 'gemini-nano-local',
            messages: history,
            stream: true,
          }),
        });

        if (!response.ok) {
          throw new Error(`Error del servidor: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // Keep incomplete line for next chunk

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.substring(6);
              if (data.trim() === '[DONE]') {
                break;
              }
              try {
                const chunk = JSON.parse(data);
                const delta = chunk.choices?.[0]?.delta?.content;
                if (delta) {
                  fullContent += delta;
                  assistantBubble.textContent = fullContent;
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                }
              } catch (e) {
                console.error('Error al parsear JSON del stream:', data);
              }
            }
          }
        }

        history.push({ role: 'assistant', content: fullContent });

      } catch (error) {
        assistantBubble.textContent = `Error: ${error.message}`;
        assistantBubble.style.background = 'var(--bad)';
      } finally {
        setReadyState(true);
      }
    }

    function init() {
      // Configuración de la URL
      saveBtn.addEventListener('click', () => {
        const url = apiUrlInput.value.trim();
        const key = apiKeyInput.value.trim();
        if (url) {
          apiBaseUrl = url.replace(/\/$/, '');
          apiKey = key;
          localStorage.setItem('miniNanoApiUrl', url);
          localStorage.setItem('miniNanoApiKey', key);
          checkConnection();
        }
      });

      apiUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          saveBtn.click();
        }
      });

      // Lógica del chat
      sendBtn.addEventListener('click', handleSend);
      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // Cargar URL guardada. Si estamos servidos por HTTP/HTTPS, la URL actual manda:
      // evita quedarse pegado a un tunel viejo guardado en localStorage.
      const savedUrl = localStorage.getItem('miniNanoApiUrl');
      const savedKey = localStorage.getItem('miniNanoApiKey') || '';
      const sameOrigin = window.location.protocol.startsWith('http') ? window.location.origin : '';
      const initialUrl = sameOrigin || savedUrl;
      if (initialUrl) {
        apiBaseUrl = initialUrl.replace(/\/$/, '');
        apiKey = savedKey;
        apiUrlInput.value = apiBaseUrl;
        apiKeyInput.value = apiKey;
        checkConnection();
      }
    }

    init();
  </script>
</body>
</html>
